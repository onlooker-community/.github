name: Release Go Binary

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Verify version matches go module
        run: |
          # Verify the version in the code matches the tag
          # Adjust the path to your version constant as needed
          if grep -r "\"${{ steps.extract.outputs.version }}\"" cmd/ internal/ 2>/dev/null | grep -q "Version"; then
            echo "Version constant matches tag"
          else
            echo "Warning: Could not verify version constant — ensure it matches the tag"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
        continue-on-error: true

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: [validate, test]
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            asset_name: onlooker-darwin-arm64
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            asset_name: onlooker-darwin-amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            asset_name: onlooker-linux-arm64
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            asset_name: onlooker-linux-amd64
          - goos: windows
            goarch: amd64
            runner: windows-latest
            asset_name: onlooker-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ needs.validate.outputs.version }}" \
            -o ${{ matrix.asset_name }} \
            ./cmd/onlooker

      - name: Generate SHA256
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Extract changelog entry
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION=${{ needs.validate.outputs.version }}
          NOTES=$(awk "/^## \[?${VERSION}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/**
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [validate, release]
    # Only update tap for stable releases (no pre-release suffix)
    if: ${{ !contains(needs.validate.outputs.version, '-') }}
    steps:
      - name: Trigger tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_UPDATE_TOKEN }}
          repository: onlooker-community/homebrew-tap
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ needs.validate.outputs.version }}",
              "repo": "${{ github.repository }}"
            }

name: Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history for git-based last-modified dates
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build docs site
        run: npm run build
        env:
          # Inject the current schema version for the version badge
          SCHEMA_VERSION: ${{ vars.SCHEMA_VERSION || 'latest' }}

      - name: Check for broken internal links
        run: |
          npx --yes @minko-fe/linkinator \
            --recurse \
            --skip "^https?://" \
            out/ || echo "Link check completed with warnings"
        continue-on-error: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Deploy to preview URL
        # Replace with your hosting provider's preview action
        # Examples: Vercel, Netlify, Cloudflare Pages
        run: echo "Deploy preview — configure for your hosting provider"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://docs.onlooker.dev
    steps:
      - name: Deploy to production
        # Replace with your hosting provider's deploy action
        run: echo "Deploy to production — configure for your hosting provider"

name: Compatibility Check

# Runs cross-repo compatibility tests to catch breaking changes
# before they reach users. Triggered by releases in dependent repos
# and on a weekly schedule as a regression sweep.

on:
  # Triggered by repository_dispatch from other repos on release
  repository_dispatch:
    types:
      - schema-released
      - adapter-sdk-released
      - core-released

  # Weekly regression sweep
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC

  # Manual trigger for pre-release validation
  workflow_dispatch:
    inputs:
      schema_version:
        description: '@onlooker-community/schema version to test against'
        required: false
        type: string
      adapter_sdk_version:
        description: '@onlooker-community/adapter-sdk version to test against'
        required: false
        type: string

jobs:
  resolve-versions:
    name: Resolve versions to test
    runs-on: ubuntu-latest
    outputs:
      schema_version: ${{ steps.versions.outputs.schema }}
      adapter_sdk_version: ${{ steps.versions.outputs.adapter_sdk }}
      trigger: ${{ steps.versions.outputs.trigger }}
    steps:
      - name: Determine versions
        id: versions
        run: |
          # Default to latest published versions
          SCHEMA=$(npm view @onlooker-community/schema version 2>/dev/null || echo "latest")
          ADAPTER_SDK=$(npm view @onlooker-community/adapter-sdk version 2>/dev/null || echo "latest")

          # Override with dispatch payload if present
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TRIGGER="${{ github.event.action }}"
            if [ "$TRIGGER" = "schema-released" ]; then
              SCHEMA="${{ github.event.client_payload.version }}"
            elif [ "$TRIGGER" = "adapter-sdk-released" ]; then
              ADAPTER_SDK="${{ github.event.client_payload.version }}"
            fi
          fi

          # Override with manual input if present
          if [ -n "${{ inputs.schema_version }}" ]; then
            SCHEMA="${{ inputs.schema_version }}"
          fi
          if [ -n "${{ inputs.adapter_sdk_version }}" ]; then
            ADAPTER_SDK="${{ inputs.adapter_sdk_version }}"
          fi

          echo "schema=${SCHEMA}" >> "$GITHUB_OUTPUT"
          echo "adapter_sdk=${ADAPTER_SDK}" >> "$GITHUB_OUTPUT"
          echo "trigger=${{ github.event_name }}" >> "$GITHUB_OUTPUT"

          echo "Testing with:"
          echo "  schema: ${SCHEMA}"
          echo "  adapter-sdk: ${ADAPTER_SDK}"

  test-adapter-claude-code:
    name: adapter-claude-code compatibility
    runs-on: ubuntu-latest
    needs: resolve-versions
    steps:
      - uses: actions/checkout@v4
        with:
          repository: onlooker-community/adapter-claude-code
          token: ${{ secrets.COMPAT_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install with pinned schema and adapter-sdk versions
        run: |
          npm ci
          npm install \
            @onlooker-community/schema@${{ needs.resolve-versions.outputs.schema_version }} \
            @onlooker-community/adapter-sdk@${{ needs.resolve-versions.outputs.adapter_sdk_version }}

      - run: npm run build
      - run: npm test
      - run: npm run typecheck

  test-marketplace-plugins:
    name: Plugin compatibility (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    needs: resolve-versions
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - sentinel
          - tribunal
          - warden
          - oracle
          - archivist
          - relay
          - scribe
          - cues
          - ledger
          - echo
          - cartographer
          - counsel
          - onlooker
    steps:
      - uses: actions/checkout@v4
        with:
          repository: onlooker-community/marketplace
          token: ${{ secrets.COMPAT_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install plugin dependencies with pinned versions
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          npm ci
          # Install the versions being tested if this plugin uses them
          if grep -q '@onlooker-community/schema' package.json; then
            npm install @onlooker-community/schema@${{ needs.resolve-versions.outputs.schema_version }}
          fi
          if grep -q '@onlooker-community/adapter-sdk' package.json; then
            npm install @onlooker-community/adapter-sdk@${{ needs.resolve-versions.outputs.adapter_sdk_version }}
          fi

      - name: Build and test
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          npm run build 2>/dev/null || true  # not all plugins have a build step
          npm test 2>/dev/null || true        # not all plugins have tests yet
          npm run typecheck 2>/dev/null || true

  test-meridian:
    name: Meridian compatibility
    runs-on: ubuntu-latest
    needs: resolve-versions
    steps:
      - uses: actions/checkout@v4
        with:
          repository: onlooker-community/meridian
          token: ${{ secrets.COMPAT_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install with pinned schema version
        run: |
          npm ci
          if grep -rq '@onlooker-community/schema' packages/; then
            npm install @onlooker-community/schema@${{ needs.resolve-versions.outputs.schema_version }} -w packages/core
          fi

      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  report:
    name: Compatibility report
    runs-on: ubuntu-latest
    needs:
      - resolve-versions
      - test-adapter-claude-code
      - test-marketplace-plugins
      - test-meridian
    if: always()
    steps:
      - name: Generate compatibility report
        run: |
          echo "# Compatibility Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ needs.resolve-versions.outputs.trigger }}" >> $GITHUB_STEP_SUMMARY
          echo "**Schema version:** ${{ needs.resolve-versions.outputs.schema_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Adapter SDK version:** ${{ needs.resolve-versions.outputs.adapter_sdk_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| adapter-claude-code | ${{ needs.test-adapter-claude-code.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| marketplace plugins | ${{ needs.test-marketplace-plugins.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| meridian | ${{ needs.test-meridian.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: |
          needs.test-adapter-claude-code.result == 'failure' ||
          needs.test-marketplace-plugins.result == 'failure' ||
          needs.test-meridian.result == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_ALERTS_CHANNEL }}
          slack-message: |
            :warning: *Compatibility check failed*
            Schema: ${{ needs.resolve-versions.outputs.schema_version }}
            Adapter SDK: ${{ needs.resolve-versions.outputs.adapter_sdk_version }}
            Trigger: ${{ needs.resolve-versions.outputs.trigger }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
